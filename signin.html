<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030711">
<meta name="description" content="KINGBOT FINTECH secure sign-in gateway.">
<title>KINGBOT FINTECH — Sign In</title>
<style>
:root{--bg:#02040a;--cyan:#19e6ff;--violet:#9b5cff;--gold:#f6b93b;--text:#eef3ff;--muted:#71809e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 40%,#08152b 0,#02040a 56%,#010208 100%);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;overflow:hidden}
.card{width:min(440px,100%);padding:36px 28px;text-align:center;border:1px solid rgba(25,230,255,.16);border-radius:24px;background:rgba(5,10,23,.88);box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 55px rgba(25,230,255,.06)}
.logo{font:900 24px Orbitron,Inter,sans-serif;letter-spacing:.16em;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--gold),var(--cyan));background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 3s linear infinite}
.core{width:76px;height:76px;margin:24px auto 20px;border-radius:50%;border:1px solid rgba(25,230,255,.3);display:grid;place-items:center;position:relative;box-shadow:0 0 35px rgba(25,230,255,.1)}
.core:before{content:"";position:absolute;inset:10px;border-radius:50%;border:1px dashed rgba(155,92,255,.35);animation:spin 4s linear infinite}
.core:after{content:"";width:16px;height:16px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan),0 0 34px rgba(246,185,59,.35);animation:pulse 1.5s ease-in-out infinite}
h1{margin:0;font:800 16px Orbitron,Inter,sans-serif;letter-spacing:.08em}
p{margin:10px 0 0;color:var(--muted);font-size:11px;line-height:1.6}
a{display:inline-block;margin-top:20px;color:var(--cyan);text-decoration:none;font-weight:800;font-size:11px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(1.35);opacity:.55}}
@keyframes flow{to{background-position:300% center}}
@media(prefers-reduced-motion:reduce){.core:before,.core:after,.logo{animation:none}}
</style>
</head>
<body>
<main class="card" aria-live="polite">
  <div class="logo">KINGBOT FINTECH</div>
  <div class="core" aria-hidden="true"></div>
  <h1>OPENING SECURE SIGN-IN</h1>
  <p id="message">Preparing the KINGBOT authentication gateway…</p>
  <a id="continue" href="access.html#signin">Continue to sign in</a>
</main>

<script>
(function(){
  "use strict";

  function buildDestination(){
    const params = new URLSearchParams(window.location.search);
    const target = new URL("access.html", window.location.href);
    const returnUrl = params.get("return");

    if(returnUrl){
      target.searchParams.set("return", returnUrl);
    }

    target.hash = "signin";
    return target.href;
  }

  const destination = buildDestination();
  const link = document.getElementById("continue");
  if(link) link.href = destination;

  // Single deterministic redirect. No meta-refresh race.
  window.location.replace(destination);
})();
</script>
</body>
</html>
