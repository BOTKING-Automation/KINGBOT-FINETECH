<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#02040a">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="description" content="KINGBOT FINTECH secure sign in">
<title>KINGBOT FINTECH — Sign In</title>
<style>
:root{--bg:#02040a;--panel:#071022;--line:rgba(255,255,255,.11);--cyan:#19e6ff;--gold:#f6b93b;--text:#eef3ff;--muted:#7f8ca6;--red:#ff5c7a;--green:#23f7a3}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100vh;background:#02040a;color:var(--text);font-family:Arial,Helvetica,sans-serif}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(430px,100%);padding:34px 28px;border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 24px 70px rgba(0,0,0,.55)}
.logo{text-align:center;font-size:21px;font-weight:900;letter-spacing:3px;color:var(--gold)}
.sub{text-align:center;margin-top:7px;color:#64728c;font-size:8px;font-weight:700;letter-spacing:2px}
.core{width:58px;height:58px;margin:22px auto;border-radius:50%;border:1px solid rgba(25,230,255,.35);display:grid;place-items:center}
.core span{width:13px;height:13px;border-radius:50%;background:var(--cyan);box-shadow:0 0 14px rgba(25,230,255,.8)}
h1{margin:0;text-align:center;font-size:17px;letter-spacing:1px}
.intro{margin:10px 0 23px;text-align:center;color:var(--muted);font-size:11px;line-height:1.6}
.field{margin-top:14px}
label{display:block;margin-bottom:7px;color:#cbd4e5;font-size:11px;font-weight:700}
input{display:block;width:100%;height:48px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:#040914;color:#fff;outline:none;font-size:13px}
input:focus{border-color:var(--cyan);box-shadow:0 0 0 2px rgba(25,230,255,.08)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 20px}
.remember{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:10px}
.remember input{width:15px;height:15px;margin:0}
.link,.bottom a{color:var(--cyan);font-size:10px;font-weight:700;text-decoration:none}
button{width:100%;height:50px;border:0;border-radius:11px;background:linear-gradient(90deg,var(--gold),#ffe29a,var(--cyan));color:#05070d;font-size:12px;font-weight:900;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.message{display:none;margin-top:13px;padding:11px;border-radius:10px;font-size:11px;line-height:1.5}
.message.show{display:block}
.message.error{color:#ffc2cc;background:rgba(255,92,122,.08);border:1px solid rgba(255,92,122,.18)}
.message.success{color:#b9ffe3;background:rgba(35,247,163,.07);border:1px solid rgba(35,247,163,.16)}
.bottom{text-align:center;margin-top:19px;color:var(--muted);font-size:10px}
.security{text-align:center;margin-top:18px;color:#536078;font-size:7px;letter-spacing:1.4px}
@media(max-width:480px){.page{padding:12px}.card{padding:28px 19px}}
</style>
</head>
<body>
<main class="page">
<section class="card">
<div class="logo">KINGBOT FINTECH</div>
<div class="sub">GIBSONFX TECH · SECURE ACCESS</div>
<div class="core" aria-hidden="true"><span></span></div>
<h1>SECURE SIGN IN</h1>
<p class="intro">Enter your registered email and password. This page remains stable until you submit the form.</p>

<form id="signInForm" novalidate>
<div class="field">
<label for="loginEmail">EMAIL ADDRESS</label>
<input id="loginEmail" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required>
</div>
<div class="field">
<label for="loginPassword">PASSWORD</label>
<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required>
</div>
<div class="row">
<label class="remember"><input id="remember" type="checkbox" checked> Remember me</label>
<a class="link" href="forgot-password.html">Forgot password?</a>
</div>
<button id="loginBtn" type="submit">SIGN IN TO KINGBOT</button>
<div id="message" class="message" role="status" aria-live="polite"></div>
</form>

<div class="bottom">New to KINGBOT? <a href="access-stable.html#signup">Create a secure account</a></div>
<div class="security">FIREBASE AUTH · VERIFIED EMAIL · SECURE SESSION</div>
</section>
</main>

<script>
(function(){
  "use strict";

  const form=document.getElementById("signInForm");
  const btn=document.getElementById("loginBtn");
  const msg=document.getElementById("message");

  function show(text,type){
    msg.textContent=text;
    msg.className="message show "+type;
  }

  function safeReturn(value){
    if(!value) return "";
    try{
      const u=new URL(value,window.location.href);
      if(u.origin!==window.location.origin) return "";
      const p=u.pathname.toLowerCase();
      if(/\/(signin|signup|access|verify)\.html$/.test(p)) return "";
      return u.pathname+u.search+u.hash;
    }catch(e){return "";}
  }

  function getDestination(){
    const p=new URLSearchParams(window.location.search);
    return safeReturn(p.get("return"))||"index.html";
  }

  form.addEventListener("submit",async function(e){
    e.preventDefault();

    const email=document.getElementById("loginEmail").value.trim();
    const password=document.getElementById("loginPassword").value;

    if(!email||!password){
      show("Enter your email and password.","error");
      return;
    }

    btn.disabled=true;
    btn.textContent="AUTHENTICATING…";

    try{
      // Firebase loads only after the user submits, preventing load-time flashing.
      if(!window.KINGBOT_FIREBASE){
        await import("./system/firebase-auth.js");
      }

      const result=await window.KINGBOT_FIREBASE.signIn({
        email:email,
        password:password,
        remember:document.getElementById("remember").checked
      });

      if(!result.verified){
        try{sessionStorage.setItem("verification_email",email);}catch(e){}
        window.location.replace("verify.html?return="+encodeURIComponent(getDestination()));
        return;
      }

      show("Authentication verified. Opening KINGBOT…","success");
      window.setTimeout(function(){
        window.location.replace(getDestination());
      },250);

    }catch(error){
      const code=String(error&&error.code||"");
      const map={
        "auth/invalid-credential":"Email or password is incorrect.",
        "auth/wrong-password":"Email or password is incorrect.",
        "auth/user-not-found":"No KINGBOT account was found for this email.",
        "auth/invalid-email":"Enter a valid email address.",
        "auth/too-many-requests":"Too many attempts. Please wait and try again.",
        "auth/network-request-failed":"Network error. Check your connection."
      };
      show(map[code]||(error&&error.message)||"Sign-in failed. Check your details and try again.","error");
      btn.disabled=false;
      btn.textContent="SIGN IN TO KINGBOT";
    }
  });
})();
</script>
</body>
</html>
