server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip off;

    location / {
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript text/javascript;
        sub_filter 'https://kingbot-fintech-api-etfv.onrender.com/api' 'http://localhost:10000/api';
        try_files $uri $uri/ =404;
    }
}
