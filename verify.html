<body>

  <main class="verify-shell">

    <section class="verify-card">

      <div class="brand">
        <div class="brand-name">
          KING<span>BOT</span>
        </div>

        <div class="brand-subtitle">
          FINTECH • ACCOUNT SECURITY
        </div>
      </div>

      <div class="verification-core" aria-hidden="true">
        <div class="ring ring-one"></div>
        <div class="ring ring-two"></div>
        <div class="core"></div>
      </div>

      <h1>VERIFY YOUR ACCOUNT</h1>

      <p class="intro">
        Enter the six-digit verification code sent to your
        registered email address.
      </p>

      <div
        id="emailDisplay"
        class="email-display">
      </div>

      <form id="verificationForm">

        <div class="code-grid">

          <input
            class="code-input"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="1"
            aria-label="Verification digit 1">

          <input
            class="code-input"
            inputmode="numeric"
            maxlength="1"
            aria-label="Verification digit 2">

          <input
            class="code-input"
            inputmode="numeric"
            maxlength="1"
            aria-label="Verification digit 3">

          <input
            class="code-input"
            inputmode="numeric"
            maxlength="1"
            aria-label="Verification digit 4">

          <input
            class="code-input"
            inputmode="numeric"
            maxlength="1"
            aria-label="Verification digit 5">

          <input
            class="code-input"
            inputmode="numeric"
            maxlength="1"
            aria-label="Verification digit 6">

        </div>

        <button
          id="verifyButton"
          class="verify-button"
          type="submit">
          VERIFY ACCOUNT
        </button>

      </form>

      <div class="resend-row">
        Didn't receive the code?

        <button
          id="resendButton"
          class="resend-button"
          type="button">
          RESEND CODE
        </button>
      </div>

      <div
        id="status"
        class="status">
      </div>

      <div class="footer">
        SECURE ACCOUNT VERIFICATION • GIBSONFX TECH
      </div>

    </section>

  </main>

  <script src="system/session.js"></script>
  <script src="system/auth-gate.js"></script>
  <script src="system/access-control.js"></script>
  <script src="system/navigation.js"></script>

  <script>
    (() => {
      "use strict";

      const inputs =
        Array.from(
          document.querySelectorAll(".code-input")
        );

      const form =
        document.getElementById("verificationForm");

      const verifyButton =
        document.getElementById("verifyButton");

      const resendButton =
        document.getElementById("resendButton");

      const status =
        document.getElementById("status");

      const emailDisplay =
        document.getElementById("emailDisplay");

      const params =
        new URLSearchParams(
          window.location.search
        );

      const returnUrl =
        params.get("return");

      function showStatus(message, type) {
        status.textContent = message;
        status.className = "status " + type;
      }

      function getCode() {
        return inputs
          .map(input => input.value.trim())
          .join("");
      }

      function setLoading(loading) {
        verifyButton.disabled = loading;
        resendButton.disabled = loading;

        verifyButton.textContent =
          loading
            ? "VERIFYING..."
            : "VERIFY ACCOUNT";
      }

      function focusFirstInput() {
        if (inputs[0]) {
          inputs[0].focus();
        }
      }

      /*
       * Display the authenticated user's email
       * when the real session manager provides it.
       */
      async function loadSession() {

        if (!window.KINGBOT_SESSION) {
          return;
        }

        try {

          const session =
            await window.KINGBOT_SESSION.check();

          if (
            session &&
            session.user &&
            session.user.email
          ) {

            emailDisplay.textContent =
              session.user.email;

            emailDisplay.style.display =
              "block";
          }

        } catch (error) {

          console.warn(
            "[KINGBOT VERIFY] Session lookup failed.",
            error
          );

        }
      }

      inputs.forEach((input, index) => {

        input.addEventListener(
          "input",
          () => {

            input.value =
              input.value
                .replace(/\D/g, "")
                .slice(0, 1);

            if (
              input.value &&
              index < inputs.length - 1
            ) {
              inputs[index + 1].focus();
            }

          }
        );

        input.addEventListener(
          "keydown",
          event => {

            if (
              event.key === "Backspace" &&
              !input.value &&
              index > 0
            ) {

              inputs[index - 1].focus();

            }

          }
        );

        input.addEventListener(
          "paste",
          event => {

            event.preventDefault();

            const pasted =
              (
                event.clipboardData ||
                window.clipboardData
              )
                .getData("text")
                .replace(/\D/g, "")
                .slice(0, 6);

            pasted
              .split("")
              .forEach((digit, i) => {

                if (inputs[i]) {
                  inputs[i].value = digit;
                }

              });

            if (pasted.length === 6) {
              inputs[5].focus();
            }

          }
        );

      });

      form.addEventListener(
        "submit",
        async event => {

          event.preventDefault();

          const code =
            getCode();

          if (!/^\d{6}$/.test(code)) {

            showStatus(
              "Enter the complete six-digit verification code.",
              "error"
            );

            return;
          }

          setLoading(true);

          showStatus(
            "Securely verifying your account...",
            "info"
          );

          try {

            /*
             * IMPORTANT:
             *
             * The frontend does not mark the account
             * as verified by itself.
             *
             * The backend must validate the code and
             * update the authenticated session.
             */

            const response =
              await fetch(
                "https://kingbot-fintech-api.onrender.com/api/auth/verify",
                {
                  method: "POST",

                  credentials: "include",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  cache: "no-store",

                  body: JSON.stringify({
                    code
                  })
                }
              );

            let data = {};

            try {
              data =
                await response.json();
            } catch (_) {
              data = {};
            }

            if (!response.ok) {

              throw new Error(
                data.message ||
                data.error ||
                "Verification failed."
              );

            }

            showStatus(
              "Account verified successfully. Redirecting...",
              "success"
            );

            /*
             * Refresh the real session before redirecting.
             */
            if (
              window.KINGBOT_SESSION &&
              typeof window.KINGBOT_SESSION.check ===
                "function"
            ) {

              await window.KINGBOT_SESSION.check();

            }

            setTimeout(() => {

              if (
                returnUrl &&
                window.KINGBOT_AUTH &&
                typeof window.KINGBOT_AUTH
                  .isSafeReturnUrl === "function" &&
                window.KINGBOT_AUTH
                  .isSafeReturnUrl(returnUrl)
              ) {

                window.location.replace(
                  returnUrl
                );

                return;
              }

              window.location.replace(
                "index.html"
              );

            }, 500);

          } catch (error) {

            console.error(
              "[KINGBOT VERIFY]",
              error
            );

            showStatus(
              error.message ||
              "Verification failed. Please try again.",
              "error"
            );

            setLoading(false);

          }

        }
      );

      resendButton.addEventListener(
        "click",
        async () => {

          resendButton.disabled = true;

          showStatus(
            "Requesting a new verification code...",
            "info"
          );

          try {

            const response =
              await fetch(
                "https://kingbot-fintech-api.onrender.com/api/auth/resend-verification",
                {
                  method: "POST",

                  credentials: "include",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  cache: "no-store"
                }
              );

            let data = {};

            try {
              data =
                await response.json();
            } catch (_) {
              data = {};
            }

            if (!response.ok) {

              throw new Error(
                data.message ||
                data.error ||
                "Unable to resend verification code."
              );

            }

            showStatus(
              "A new verification code has been sent.",
              "success"
            );

          } catch (error) {

            console.error(
              "[KINGBOT VERIFY RESEND]",
              error
            );

            showStatus(
              error.message ||
              "Unable to resend the code.",
              "error"
            );

          } finally {

            setTimeout(() => {

              resendButton.disabled = false;

            }, 30000);

          }

        }
      );

      loadSession();
      focusFirstInput();

    })();
  </script>

</body>
</html>
