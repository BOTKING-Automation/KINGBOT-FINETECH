<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KINGBOT FINTECH — Set New Password</title><link rel="stylesheet" href="system/platform.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#02040a;color:#eef2ff;font-family:Inter,system-ui,sans-serif}.card{max-width:500px;width:100%;padding:34px;border-radius:26px;background:rgba(7,11,21,.94);border:1px solid rgba(25,230,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.5)}.brand{text-align:center;font:900 24px Orbitron;letter-spacing:3px;background:linear-gradient(90deg,#fff,#19e6ff,#9b5cff,#ffc84a);-webkit-background-clip:text;color:transparent;margin-bottom:26px}h1{font:700 22px Orbitron;margin:0 0 9px}.sub{color:#8d98ad;font-size:13px;line-height:1.7;margin-bottom:22px}label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#08101f;color:#fff;outline:none}input:focus{border-color:#19e6ff;box-shadow:0 0 20px rgba(25,230,255,.1)}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#19e6ff,#9b5cff,#ffc84a);color:#050812;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.msg{margin-top:14px;padding:12px;border-radius:12px;font-size:12px;line-height:1.5}.error{color:#ffb8c5;background:rgba(255,77,109,.08)}.success{color:#a8ffda;background:rgba(35,247,163,.07)}.back{text-align:center;margin-top:20px;font-size:12px}.back a{color:#19e6ff;text-decoration:none;font-weight:700}
</style></head><body><main class="card"><div class="brand">KINGBOT FINTECH</div><h1>Set a new password</h1><p class="sub">Your email has been verified. Choose a new password of at least 8 characters and confirm it below.</p><form id="form"><label for="password">NEW PASSWORD</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><label for="confirm">CONFIRM PASSWORD</label><input id="confirm" type="password" minlength="8" required autocomplete="new-password"><button id="btn" type="submit">SET NEW PASSWORD</button></form><div id="msg" class="msg" style="display:none"></div><div class="back"><a href="signin.html">← Back to secure sign in</a></div></main>
<script>
const API="https://kingbot-fintech-api-etfv.onrender.com/api/auth",form=document.getElementById("form"),btn=document.getElementById("btn"),msg=document.getElementById("msg"),stored=sessionStorage.getItem("kingbot_password_recovery");let recovery=null;try{recovery=stored?JSON.parse(stored):null}catch{}
function show(t,c){msg.textContent=t;msg.className="msg "+c;msg.style.display="block"}
if(!recovery?.email||!recovery?.recoveryToken){form.style.display="none";show("Your password recovery session is missing or expired. Start again from Forgot Password.","error");setTimeout(()=>location.replace("forgot-password.html"),1800)}
form.addEventListener("submit",async e=>{e.preventDefault();if(!recovery?.email||!recovery?.recoveryToken)return;const p=document.getElementById("password").value,c=document.getElementById("confirm").value;if(p.length<8){show("Password must contain at least 8 characters.","error");return}if(p!==c){show("Passwords do not match.","error");return}btn.disabled=true;btn.textContent="UPDATING...";try{const r=await fetch(API+"/password/reset",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:recovery.email,recoveryToken:recovery.recoveryToken,password:p})});const d=await r.json().catch(()=>({}));if(!r.ok){show(d.error||"Password reset failed. Request a new code.","error");btn.disabled=false;btn.textContent="SET NEW PASSWORD";return}sessionStorage.removeItem("kingbot_password_recovery");sessionStorage.removeItem("kingbot_reset_email");show("Password changed successfully. Redirecting to secure sign in...","success");setTimeout(()=>location.replace("signin.html"),1200)}catch(e){show("Password recovery service is unavailable.","error");btn.disabled=false;btn.textContent="SET NEW PASSWORD"}});
</script><script src="system/navigation.js"></script></body></html>
