<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINGBOT FINTECH — Reset Password</title>
<link rel="stylesheet" href="system/platform.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:480px;width:100%;padding:32px;border-radius:24px}label{display:block;margin:14px 0 7px}input,button{width:100%;padding:14px;border-radius:12px}input{background:#08101f;border:1px solid rgba(25,230,255,.25);color:#fff}button{margin-top:18px;border:0;background:linear-gradient(90deg,#19e6ff,#9b5cff);color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px}</style>
</head><body><main class="card kb-neon-frame">
<div class="kb-gradient-text kb-title">RESET PASSWORD</div>
<p>Set a new KINGBOT FINTECH password.</p>
<form id="form"><label>New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button>RESET PASSWORD</button></form>
<div id="msg" class="msg"></div></main>
<script>
const q=new URLSearchParams(location.search),token=q.get("token"),email=q.get("email"),msg=document.getElementById("msg");
document.getElementById("form").addEventListener("submit",async e=>{e.preventDefault();if(!token||!email){msg.textContent="Invalid or expired reset link.";return}
try{const r=await fetch((window.API_BASE||"https://kingbot-fintech-api.onrender.com/api")+"/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email,token,password:document.getElementById("password").value})});const d=await r.json();msg.textContent=d.ok?"Password reset successfully. You can sign in now.":(d.error||"Reset failed.");}catch{msg.textContent="Password recovery service unavailable."}});
</script></body></html>
