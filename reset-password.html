<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINGBOT FINTECH — Reset Password</title>
<link rel="stylesheet" href="system/platform.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:480px;width:100%;padding:32px;border-radius:24px}label{display:block;margin:14px 0 7px}input,button{width:100%;padding:14px;border-radius:12px}input{background:#08101f;border:1px solid rgba(25,230,255,.25);color:#fff}button{margin-top:18px;border:0;background:linear-gradient(90deg,#19e6ff,#9b5cff);color:#fff;font-weight:800;cursor:pointer}.msg{margin-top:14px}</style>
</head><body><main class="card kb-neon-frame">
<div class="kb-gradient-text kb-title">RESET PASSWORD</div>
<p>Set a new KINGBOT FINTECH password.</p>
<form id="form"><label>New password</label><input id="password" type="password" minlength="8" required autocomplete="new-password"><button>RESET PASSWORD</button></form>
<div id="msg" class="msg"></div></main>
<script type="module">
import "./system/firebase-auth.js";
const form=document.getElementById("form"),msg=document.getElementById("msg");
const q=new URLSearchParams(location.search);
const mode=q.get("mode"),oobCode=q.get("oobCode");
if(mode==="resetPassword"&&oobCode){
 form.addEventListener("submit",async e=>{
  e.preventDefault();
  try{
   const {confirmPasswordReset}=await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js");
   const password=document.getElementById("password").value;
   if(password.length<8){msg.textContent="Password must contain at least 8 characters.";return;}
   await confirmPasswordReset(window.KINGBOT_FIREBASE.auth,oobCode,password);
   msg.textContent="Password reset successfully. You can sign in now.";
   setTimeout(()=>location.replace("signin.html"),1200);
  }catch(err){msg.textContent=err.message||"Reset link is invalid or expired.";}
 });
}else{msg.textContent="Open the password-reset link from Firebase to continue.";}
</script>
</script></body></html>
