<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KINGBOT FINTECH — Password Recovery</title>
<link rel="stylesheet" href="system/platform.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#02040a;color:#eef2ff;font-family:Inter,system-ui,sans-serif}
.card{max-width:480px;width:100%;padding:34px;border-radius:24px;background:rgba(7,11,21,.94);border:1px solid rgba(25,230,255,.18);box-shadow:0 30px 90px rgba(0,0,0,.5)}
h1{font-family:Orbitron,sans-serif;font-size:22px;margin:0 0 10px}.sub{color:#8490a8;font-size:13px;line-height:1.6;margin-bottom:24px}
label{display:block;font-size:12px;font-weight:700;margin:14px 0 7px}input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#08101f;color:#fff;outline:none}
input:focus{border-color:#19e6ff;box-shadow:0 0 20px rgba(25,230,255,.1)}
button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#19e6ff,#9b5cff,#ffc84a);color:#050812;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-size:12px;line-height:1.5}.msg.show{display:block}.msg.error{color:#ffb8c5;background:rgba(255,77,109,.08)}.msg.success{color:#a8ffda;background:rgba(35,247,163,.07)}
.back{text-align:center;margin-top:20px;font-size:12px}.back a{color:#19e6ff;text-decoration:none;font-weight:700}
</style></head>
<body><main class="card">
<div class="kb-gradient-text kb-title">KINGBOT FINTECH</div>
<h1>PASSWORD RECOVERY</h1>
<p class="sub">Enter your registered email address. If an account exists, KINGBOT will send a secure password-reset link.</p>
<form id="form"><label for="email">EMAIL ADDRESS</label><input id="email" type="email" required autocomplete="email"><button id="button" type="submit">SEND RESET LINK</button></form>
<div id="msg" class="msg"></div><div class="back"><a href="signin.html">← Back to secure sign in</a></div>
</main>
<script type="module">
import "./system/firebase-auth.js";
const form=document.getElementById("form"),button=document.getElementById("button"),msg=document.getElementById("msg");
function show(text,type){msg.textContent=text;msg.className="msg show "+type}
form.addEventListener("submit",async e=>{
 e.preventDefault();button.disabled=true;button.textContent="SENDING...";
 try{await window.KINGBOT_FIREBASE.sendPasswordReset(document.getElementById("email").value.trim());show("If the email is registered, Firebase has sent a secure password-reset link. Check your inbox and spam folder.","success");form.reset();}
 catch(err){show(err.message||"Password recovery service unavailable.","error");}
 finally{button.disabled=false;button.textContent="SEND RESET LINK";}
});
</script>
</script></body></html>
