<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KINGBOT FINTECH — Neural Startup</title>
<style>
:root{--cyan:#19e6ff;--violet:#9b5cff;--pink:#ff4fd8;--gold:#f6b93b;--green:#23f7a3}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:radial-gradient(circle at 50% 45%,#08152b 0%,#02040a 48%,#010208 100%);color:#eef3ff;font-family:Inter,system-ui,sans-serif}
#kb-loader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 45%,#08152b 0%,#02040a 48%,#010208 100%);overflow:hidden}
#kb-loader:before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 90deg,rgba(25,230,255,.08),rgba(155,92,255,.09),rgba(255,79,216,.08),rgba(246,185,59,.08),rgba(35,247,163,.07),rgba(25,230,255,.08));filter:blur(40px);animation:aura 8s ease-in-out infinite}
#kb-loader:after{content:"";position:absolute;inset:0;opacity:.3;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at 50% 50%,black 20%,transparent 85%)}
.core{position:relative;z-index:2;width:min(920px,95vw);text-align:center;padding:24px 16px}
.brand{font:900 20px Orbitron,Inter,sans-serif;letter-spacing:.18em;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--gold),var(--green),var(--cyan));background-size:500% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradient 3.2s linear infinite}
.sub{margin-top:8px;color:#7b89ab;font:700 8px "JetBrains Mono",monospace;letter-spacing:.22em}
.stage{position:relative;width:min(760px,95vw);height:360px;margin:10px auto 5px;display:grid;place-items:center;perspective:1200px}
.halo{position:absolute;width:335px;height:335px;border-radius:50%;border:1px solid rgba(25,230,255,.22);box-shadow:0 0 100px rgba(25,230,255,.12),inset 0 0 80px rgba(246,185,59,.06);animation:spin 12s linear infinite}
.halo:before,.halo:after{content:"";position:absolute;border-radius:50%;inset:24px;border:1px dashed rgba(155,92,255,.3);animation:spinReverse 8s linear infinite}
.halo:after{inset:55px;border-style:solid;border-color:rgba(246,185,59,.22);animation-duration:11s}
.brain{position:relative;width:min(370px,82vw);height:280px;transform-style:preserve-3d;animation:float 2.4s ease-in-out infinite}
.brain-image-wrap{position:relative;width:100%;height:100%;display:grid;place-items:center;transform-style:preserve-3d}
.brain-image{width:100%;height:100%;object-fit:contain;display:block;mix-blend-mode:screen;filter:drop-shadow(0 0 16px rgba(25,230,255,.55)) drop-shadow(0 0 42px rgba(25,230,255,.22)) hue-rotate(0deg) saturate(1.25) brightness(1.08);animation:brainColor 7s linear infinite,brainDepth 3.5s ease-in-out infinite}
.brain-energy{position:absolute;inset:8% 7%;border-radius:48%;pointer-events:none;background:conic-gradient(from 120deg,rgba(25,230,255,.15),rgba(155,92,255,.2),rgba(255,79,216,.18),rgba(246,185,59,.17),rgba(35,247,163,.16),rgba(25,230,255,.15));mix-blend-mode:screen;filter:blur(24px);opacity:.75;animation:energyShift 5s linear infinite}
@keyframes brainColor{0%,100%{filter:drop-shadow(0 0 16px rgba(25,230,255,.6)) drop-shadow(0 0 42px rgba(25,230,255,.24)) hue-rotate(0deg) saturate(1.3) brightness(1.1)}20%{filter:drop-shadow(0 0 18px rgba(155,92,255,.62)) drop-shadow(0 0 44px rgba(155,92,255,.24)) hue-rotate(55deg) saturate(1.4) brightness(1.12)}40%{filter:drop-shadow(0 0 18px rgba(255,79,216,.65)) drop-shadow(0 0 46px rgba(255,79,216,.25)) hue-rotate(115deg) saturate(1.45) brightness(1.12)}60%{filter:drop-shadow(0 0 18px rgba(246,185,59,.65)) drop-shadow(0 0 46px rgba(246,185,59,.25)) hue-rotate(190deg) saturate(1.5) brightness(1.15)}80%{filter:drop-shadow(0 0 18px rgba(35,247,163,.65)) drop-shadow(0 0 46px rgba(35,247,163,.25)) hue-rotate(260deg) saturate(1.45) brightness(1.12)}}
@keyframes brainDepth{50%{transform:translateY(-6px) rotateY(-3deg) rotateX(2deg) scale(1.015)}}
@keyframes energyShift{to{transform:rotate(360deg) scale(1.06);filter:blur(28px);opacity:.95}}

.brain svg{width:100%;height:100%;overflow:visible}
.rim{fill:none;stroke:url(#stroke);stroke-width:1.2;opacity:.58;transform:translateZ(-20px) scale(.94)}
.body{fill:url(#fill);fill-opacity:.12;stroke:url(#stroke);stroke-width:2.8;filter:url(#glow)}
.circuit{fill:none;stroke:url(#circuit);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 5;filter:url(#glow);animation:flow 1.6s linear infinite}
.circuit.s2{animation-duration:2.5s;animation-delay:-.7s}.circuit.s3{animation-duration:3.1s;animation-delay:-1.4s}
.node{fill:#fff;stroke:url(#circuit);stroke-width:1.2;filter:url(#glow);animation:node 1s ease-in-out infinite alternate}
.chip{fill:rgba(4,12,28,.78);stroke:url(#circuit);stroke-width:1.4;filter:url(#glow)}
.chipline{stroke:url(#circuit);stroke-width:1.1}
.scan{fill:none;stroke:url(#circuit);stroke-width:2;stroke-dasharray:25 18;filter:url(#glow);animation:scan 2.2s linear infinite}
.pulse{position:absolute;top:49%;left:50%;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 18px var(--cyan),0 0 36px var(--pink),0 0 68px rgba(246,185,59,.55);transform:translate(-50%,-50%) translateZ(35px);animation:pulse 1s ease-in-out infinite}
.market{position:absolute;left:50%;bottom:17px;width:min(420px,84vw);height:112px;transform:translateX(-50%) rotateX(58deg) rotateZ(-1deg);transform-style:preserve-3d}
.grid{position:absolute;inset:0;border:1px solid rgba(25,230,255,.15);background:linear-gradient(rgba(25,230,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(155,92,255,.025) 1px,transparent 1px);background-size:32px 18px;box-shadow:0 0 35px rgba(25,230,255,.05),inset 0 0 25px rgba(155,92,255,.05)}
.line{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);filter:url(#glow)}
.line polyline{fill:none;stroke:url(#line);stroke-width:2.7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:14 8;animation:trace 3s linear infinite}
.candles{position:absolute;inset:8px 18px 10px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 14px}
.candle{position:relative;width:18px;height:var(--h);border-radius:3px;background:linear-gradient(90deg,rgba(255,255,255,.7),rgba(255,255,255,.14) 15%,var(--c1) 33%,var(--c2) 78%,rgba(0,0,0,.45));border:1px solid rgba(255,255,255,.25);box-shadow:0 0 10px var(--glow),0 0 26px var(--glow);animation:cfloat 1.15s ease-in-out infinite alternate}
.candle:before,.candle:after{content:"";position:absolute;left:50%;width:2px;transform:translateX(-50%);background:linear-gradient(var(--glow),rgba(255,255,255,.4));box-shadow:0 0 9px var(--glow)}
.candle:before{top:-20px;height:20px}.candle:after{bottom:-13px;height:13px}
.readout{display:flex;justify-content:center;gap:24px;flex-wrap:wrap;color:#657492;font:700 7px "JetBrains Mono",monospace;letter-spacing:.08em}.readout b{color:#eef3ff}
.status{min-height:23px;margin-top:10px;font:900 10px Orbitron,Inter,sans-serif;letter-spacing:.17em;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--gold),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent}
.progress{width:min(560px,92vw);height:5px;margin:10px auto 0;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--pink),var(--gold),var(--green));box-shadow:0 0 20px rgba(25,230,255,.7);animation:progress 10s linear forwards}
.foot{margin-top:13px;color:#4f5d78;font:600 7px "JetBrains Mono",monospace;letter-spacing:.1em}
@keyframes aura{0%,100%{transform:scale(1) rotate(0);opacity:.75}50%{transform:scale(1.08) rotate(35deg);opacity:1}}
@keyframes gradient{to{background-position:500% center}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinReverse{to{transform:rotate(-360deg)}}@keyframes float{50%{transform:translateY(-8px) rotateY(-4deg) rotateX(2deg)}}@keyframes flow{to{stroke-dashoffset:-56}}@keyframes node{to{opacity:.38}}@keyframes scan{to{stroke-dashoffset:-86}}@keyframes pulse{50%{transform:translate(-50%,-50%) translateZ(35px) scale(1.8);opacity:.45}}@keyframes trace{to{stroke-dashoffset:-88}}@keyframes cfloat{to{transform:translateY(-4px);filter:brightness(1.35)}}@keyframes progress{to{width:100%}}
@media(max-width:640px){.stage{height:300px}.brain{width:300px;height:225px}.market{width:335px}.brand{font-size:15px}.sub{font-size:6px}.candle{width:14px}}
</style>
</head>
<body>
<div id="kb-loader">
<div class="core">
<div class="brand">KINGBOT FINTECH</div>
<div class="sub">NEURAL TRADING INFRASTRUCTURE · SECURE INITIALIZATION</div>

<div class="halo"></div>

</div></div></div></div>
<div class="readout"><span>AI CORE <b>ACTIVE</b></span><span>CYBER NEURAL CORE <b>ONLINE</b></span><span>UPTREND MATRIX <b>LINKING</b></span></div>

</div></div>

<script>
(function(){
  "use strict";
  var states=["NEURAL CORE INITIALIZING","MARKET MATRIX LINKING","BOT BRAIN SYNCHRONIZING","RISK ENGINE ONLINE","AUTH GATE READY"];
  var status=document.getElementById("status");
  var i=0;
  var ticker=window.setInterval(function(){
    i=(i+1)%states.length;
    if(status) status.textContent=states[i];
  },900);

  window.setTimeout(function(){
    window.clearInterval(ticker);
    window.location.replace("access.html#signin");
  },10000);
})();
</script>
</body>
</html>
