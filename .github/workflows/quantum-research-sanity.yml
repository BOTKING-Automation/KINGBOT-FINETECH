name: KINGBOT Quantum Research Sanity

on:
  pull_request:
    paths:
      - "research/quantum_lab/**"
      - ".github/workflows/quantum-research-sanity.yml"
  push:
    branches: [main]
    paths:
      - "research/quantum_lab/**"
      - ".github/workflows/quantum-research-sanity.yml"

permissions:
  contents: read

jobs:
  offline-research-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile research modules
        run: python -m compileall -q research/quantum_lab
      - name: Run offline research tests
        run: python -m unittest discover -s research/quantum_lab -p "test_*.py" -v

  qualtran-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install isolated Qualtran research dependency
        run: python -m pip install --no-cache-dir -r research/quantum_lab/requirements.txt
      - name: Build and resource-count XAUUSD tail-probability Bloq
        run: python -m unittest research.quantum_lab.test_qualtran_integration -v
