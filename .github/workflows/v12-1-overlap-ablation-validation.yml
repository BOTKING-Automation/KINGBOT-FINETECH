name: KINGBOT V12.1 Overlap and Ablation Validation

on:
  pull_request:
    branches: [v12-multivariate-research]
    types: [opened, synchronize, reopened]
    paths:
      - "research/v12-multivariate/**"
      - "backend/scripts/v9-fetch-live-markets.mjs"
      - ".github/workflows/v12-1-overlap-ablation-validation.yml"
      - ".github/workflows/v12-1-overlap-ablation-run.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-signal-service/requirements.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Syntax and regression tests
        run: |
          node --check backend/scripts/v9-fetch-live-markets.mjs
          python -m py_compile ml-signal-service/service.py research/v12-multivariate/multivariate_transformer.py research/v12-multivariate/run_multivariate_research.py
          python -m unittest discover -s research/v12-multivariate -p "test_*.py"
