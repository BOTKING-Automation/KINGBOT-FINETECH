name: KINGBOT V12.5 Joint Confidence Abstention Research

on:
  push:
    branches: [v12-5-joint-confidence-abstention-research]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    if: github.ref == 'refs/heads/v12-5-joint-confidence-abstention-research' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-signal-service/requirements.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Validate V12.5 code and regression suite
        run: |
          node --check backend/scripts/v122-fetch-live-markets.mjs
          python -m py_compile ml-signal-service/service.py research/v12-multivariate/multivariate_transformer.py research/v12-multivariate/run_v122_hold_research.py research/v12-multivariate/technical_pattern_features.py research/v12-multivariate/run_v123_cortex_research.py research/v12-multivariate/run_v124_regime_selective_research.py research/v12-multivariate/run_v125_joint_confidence_research.py research/v12-multivariate/test_v124_regime_selective_research.py research/v12-multivariate/test_v125_joint_confidence_research.py
          python -m unittest discover -s research/v12-multivariate -p "test_*.py"
      - name: Fetch closed market history for V12.5 experiment
        env:
          KINGBOT_V122_HISTORY_LIMIT: "3000"
        run: node backend/scripts/v122-fetch-live-markets.mjs /tmp/kingbot-v125-input.json
      - name: Run V12.5 joint-confidence abstention ablation
        run: python research/v12-multivariate/run_v125_joint_confidence_research.py /tmp/kingbot-v125-input.json /tmp/kingbot-v125-report.json
      - name: Upload V12.5 report and market inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingbot-v125-joint-confidence-research
          path: |
            /tmp/kingbot-v125-input.json
            /tmp/kingbot-v125-report.json
          if-no-files-found: warn
          retention-days: 14
