name: KINGBOT Oracle Deployment CI

on:
  pull_request:
    branches: ["main"]
    paths:
      - "deploy/oracle/**"
      - "Dockerfile"
      - ".dockerignore"
      - "backend/package.json"
      - "backend/src/**"
      - "ml-signal-service/**"
      - ".github/workflows/oracle-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-validation-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: docker compose version

      - name: Prepare a disposable validation environment
        run: cp deploy/oracle/.env.example deploy/oracle/.env

      - name: Validate the Compose configuration
        working-directory: deploy/oracle
        run: docker compose config --quiet

      - name: Build the API, worker and ML service images
        working-directory: deploy/oracle
        run: docker compose build --pull api worker ml-signal

      - name: Remove validation secrets
        if: always()
        run: rm -f deploy/oracle/.env
