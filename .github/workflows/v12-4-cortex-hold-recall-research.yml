name: KINGBOT V12.4 Cortex Class-Balance and HOLD-Recall Research

on:
  push:
    branches: [v12-4-cortex-hold-recall-research]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kingbot-v124-cortex-hold-recall
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-signal-service/requirements.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Validate V12.4 code and research tests
        run: |
          node --check backend/scripts/deriv-history-retry.mjs
          node --check backend/scripts/deriv-history-retry.test.mjs
          node --check backend/scripts/v122-fetch-live-markets.mjs
          node --test backend/scripts/deriv-history-retry.test.mjs
          python -m py_compile             ml-signal-service/service.py             research/v12-multivariate/multivariate_transformer.py             research/v12-multivariate/technical_pattern_features.py             research/v12-multivariate/run_v122_hold_research.py             research/v12-multivariate/run_v123_cortex_research.py             research/v12-multivariate/run_v124_hold_recall_research.py             research/v12-multivariate/test_v124_hold_recall_research.py
          python -m unittest discover -s research/v12-multivariate -p "test_*.py"
      - name: Fetch closed multi-market history from free public sources
        env:
          KINGBOT_V122_HISTORY_LIMIT: "3000"
        run: node backend/scripts/v122-fetch-live-markets.mjs /tmp/kingbot-v124-input.json
      - name: Run V12.4 class-balance and HOLD-recall ablations
        run: python research/v12-multivariate/run_v124_hold_recall_research.py /tmp/kingbot-v124-input.json /tmp/kingbot-v124-report.json
      - name: Upload V12.4 report and timestamped market inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kingbot-v124-cortex-hold-recall-research
          path: |
            /tmp/kingbot-v124-input.json
            /tmp/kingbot-v124-report.json
          if-no-files-found: warn
          retention-days: 14
