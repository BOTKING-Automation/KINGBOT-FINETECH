name: KINGBOT V12.2 BTC and HOLD Research Validation

on:
  pull_request:
    branches: [v12-1-overlap-ablation-research]
    types: [opened, synchronize, reopened]
    paths:
      - "research/v12-multivariate/run_v122_hold_research.py"
      - "research/v12-multivariate/test_v122_hold_research.py"
      - "research/v12-multivariate/V12.2_HOLD_RESEARCH.md"
      - "backend/scripts/v122-fetch-live-markets.mjs"
      - ".github/workflows/v12-2-btc-hold-validation.yml"
      - ".github/workflows/v12-2-btc-hold-research.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ML dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-signal-service/requirements.txt
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: backend
        run: npm install --omit=dev
      - name: Syntax and regression tests
        run: |
          node --check backend/scripts/v122-fetch-live-markets.mjs
          python -m py_compile ml-signal-service/service.py research/v12-multivariate/multivariate_transformer.py research/v12-multivariate/run_v122_hold_research.py research/v12-multivariate/test_v122_hold_research.py
          python -m unittest discover -s research/v12-multivariate -p "test_*.py"
