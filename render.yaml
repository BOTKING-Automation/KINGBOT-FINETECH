services:
  - type: web
    name: kingbot-fintech-api
    runtime: node
    plan: free
    repo: https://github.com/BOTKING-Automation/KINGBOT-FINETECH
    branch: main
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingbot-fintech-db
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BROKER_CREDENTIALS_KEY
        sync: false
      - key: WORKER_STANDBY
        value: "1"
      - key: KINGBOT_AI_STRATEGIES_REQUIRED
        value: "true"
      - key: KINGBOT_ML_SIGNAL_HOST
        fromService:
          name: kingbot-ml-signal
          type: web
          property: host
      - key: KINGBOT_ML_SIGNAL_PORT
        fromService:
          name: kingbot-ml-signal
          type: web
          property: port
      - key: KINGBOT_ML_SIGNAL_SECRET
        fromService:
          name: kingbot-ml-signal
          type: web
          envVarKey: KINGBOT_ML_SIGNAL_SECRET

  - type: worker
    name: kingbot-fintech-worker
    runtime: node
    plan: free
    repo: https://github.com/BOTKING-Automation/KINGBOT-FINETECH
    branch: main
    rootDir: ""
    buildCommand: npm install --omit=dev
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingbot-fintech-db
          property: connectionString
      - key: BROKER_CREDENTIALS_KEY
        sync: false
      - key: WORKER_STANDBY
        value: "1"
      - key: KINGBOT_AI_STRATEGIES_REQUIRED
        value: "true"
      - key: KINGBOT_ML_SIGNAL_HOST
        fromService:
          name: kingbot-ml-signal
          type: web
          property: host
      - key: KINGBOT_ML_SIGNAL_PORT
        fromService:
          name: kingbot-ml-signal
          type: web
          property: port
      - key: KINGBOT_ML_SIGNAL_SECRET
        fromService:
          name: kingbot-ml-signal
          type: web
          envVarKey: KINGBOT_ML_SIGNAL_SECRET

  - type: web
    name: kingbot-ml-signal
    runtime: python
    plan: free
    repo: https://github.com/BOTKING-Automation/KINGBOT-FINETECH
    branch: main
    rootDir: ml-signal-service
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python service.py
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: KINGBOT_ML_SIGNAL_SECRET
        generateValue: true
      - key: KINGBOT_ML_MIN_BARS
        value: "150"
      - key: KINGBOT_ML_FORWARD_BARS
        value: "3"
      - key: KINGBOT_ML_LABEL_ATR
        value: "0.35"
      - key: KINGBOT_ML_MAX_MODELS
        value: "50"
      - key: KINGBOT_ML_MAX_MARKETS
        value: "12"
      - key: KINGBOT_ML_MAX_BARS_PER_MARKET
        value: "320"
      - key: KINGBOT_ML_MAX_BODY_BYTES
        value: "1500000"
