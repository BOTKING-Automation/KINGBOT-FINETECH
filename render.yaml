services:
  - type: web
    name: kingbot-fintech-api
    runtime: node
    plan: free
    repo: https://github.com/BOTKING-Automation/KINGBOT-FINETECH
    branch: main
    rootDir: backend
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingbot-fintech-db
          property: connectionString
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BROKER_CREDENTIALS_KEY
        sync: false

  - type: web
    name: kingbot-fintech-worker
    runtime: node
    plan: free
    repo: https://github.com/BOTKING-Automation/KINGBOT-FINETECH
    branch: main
    rootDir: ""
    buildCommand: npm install --omit=dev
    startCommand: npm run worker
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kingbot-fintech-db
          property: connectionString
      - key: BROKER_CREDENTIALS_KEY
        sync: false
