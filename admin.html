<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KINGBOT — Admin Payment Control</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;800&family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="system/platform.css"><style>main{width:min(1250px,calc(100% - 30px));margin:auto;padding:40px 0 70px}.panel{padding:28px;border:1px solid rgba(246,185,59,.16);border-radius:24px;background:linear-gradient(145deg,rgba(10,18,40,.94),rgba(3,7,18,.98))}.ey{font:800 10px "JetBrains Mono";letter-spacing:.2em;color:#19e6ff}.title{font:900 42px Orbitron;margin:12px 0;background:linear-gradient(100deg,#f6b93b,#19e6ff,#9b5cff,#ff4fd8);-webkit-background-clip:text;color:transparent}.notice{padding:15px;border-radius:13px;background:rgba(25,230,255,.05);border:1px solid rgba(25,230,255,.12);color:#aebbd2}.queue{display:grid;gap:14px;margin-top:18px}.card{padding:20px;border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.025)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.label{font:700 9px "JetBrains Mono";color:#687590;letter-spacing:.1em}.value{color:#edf3ff;font-weight:700;margin-top:4px;word-break:break-word}.actions{display:flex;gap:10px;margin-top:15px;flex-wrap:wrap}button{padding:11px 15px;border-radius:10px;border:0;font-weight:900;cursor:pointer}.approve{background:linear-gradient(90deg,#19e6ff,#9b5cff);color:#06101d}.reject{background:rgba(255,75,125,.1);border:1px solid rgba(255,75,125,.3);color:#ff9ab6}.muted{color:#7f8ba5}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.title{font-size:31px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><div data-kingbot-navigation></div><main><section class="panel"><div class="ey">DEVELOPER / PAYMENT OPERATIONS</div><h1 class="title">Payment Verification Center</h1><div id="state" class="notice">Loading secure payment queue…</div><div id="queue" class="queue"></div></section></main><script src="system/session.js"></script><script src="system/auth-gate.js"></script><script src="system/navigation.js"></script><script>
(async()=>{
const API="https://kingbot-fintech-api.onrender.com",state=document.getElementById("state"),queue=document.getElementById("queue");
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}
async function load(){
 const r=await fetch(API+"/api/subscription/admin/payments",{credentials:"include"});const d=await r.json().catch(()=>({}));
 if(!r.ok){state.textContent=d.error||"Administrator access required.";queue.innerHTML="";return}
 const pending=(d.payments||[]).filter(p=>p.status==="pending").length;state.textContent="Secure queue • "+pending+" pending payment(s)";
 queue.innerHTML=(d.payments||[]).map(p=>{
  const buttons=p.status==="pending"?"<div class='actions'><button class='approve' data-action='approve' data-id='"+esc(p.id)+"'>VERIFY & GRANT ACCESS</button><button class='reject' data-action='reject' data-id='"+esc(p.id)+"'>REJECT</button></div>":"<div class='muted' style='margin-top:12px'>Reviewed by "+esc(p.reviewed_by||"admin")+"</div>";
  return "<article class='card'><div class='grid'><div><div class='label'>CUSTOMER</div><div class='value'>"+esc(p.first_name)+" "+esc(p.last_name)+"</div></div><div><div class='label'>PLAN</div><div class='value'>"+esc(p.plan_id)+"</div></div><div><div class='label'>M-PESA CODE</div><div class='value'>"+esc(p.mpesa_code)+"</div></div><div><div class='label'>AMOUNT KES</div><div class='value'>"+esc(p.amount_kes)+"</div></div><div><div class='label'>EMAIL</div><div class='value'>"+esc(p.email)+"</div></div><div><div class='label'>PAYER PHONE</div><div class='value'>"+esc(p.payer_phone||p.phone)+"</div></div><div><div class='label'>STATUS</div><div class='value'>"+esc(p.status)+"</div></div><div><div class='label'>SUBMITTED</div><div class='value'>"+esc(new Date(p.submitted_at).toLocaleString())+"</div></div></div>"+buttons+"</article>";
 }).join("")||"<div class='muted'>No payment submissions yet.</div>";
}
queue.addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;const action=b.dataset.action,id=b.dataset.id;let note="";
 if(action==="reject"){note=prompt("Reason for rejection:")||"";if(!note)return}else{if(!confirm("Verify this M-Pesa payment and grant the subscription entitlements?"))return;note=prompt("Optional approval note:")||""}
 const r=await fetch(API+"/api/subscription/admin/payments/"+encodeURIComponent(id)+"/"+action,{method:"POST",headers:{"Content-Type":"application/json"},credentials:"include",body:JSON.stringify({note})});const d=await r.json().catch(()=>({}));
 alert(d.ok?(action==="approve"?"Payment verified and bot access granted.":"Payment rejected."):d.error||"Request failed.");if(d.ok)load();
});
load();setInterval(load,30000);
})();
</script></body></html>
